name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: go goreleaser cosign
      - name: Release Binaries
        run: mise run release
        env:
          GITHUB_TOKEN: ${{secrets.GH_PAT}}
